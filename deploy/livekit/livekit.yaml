# LiveKit server config for Docker Compose.
# Keys must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey: devsecret-change-me-000000000000
logging:
  level: info
